function fplan(n){
  if(n.getDay()!==5) return null;
  const f=C.fri;
  const adzan=(+f.a1||0)+(+f.a2||0);
  const start=at(n,T.Dhuhr);
  const pre=new Date(start.getTime()-60000);
  const ae=new Date(start.getTime()+adzan*60000);
  const ke=new Date(ae.getTime()+f.khutbah*60000);
  const pe=new Date(ke.getTime()+f.prayer*60000);
  const re=new Date(pe.getTime()+f.rawatib*60000);
  return{
    pre,
    adzan:start,
    ae,
    ke,
    pe,
    re
  };
}

function processBeep(s,n){
  const key=s?s.m+':'+(s.k||''):'';

  if(s){
    const remain=Math.ceil((s.e-n)/1000);
    console.log('MODE=',s.m,'REMAIN=',remain);

    // Warning 5 detik sebelum masuk waktu sholat
    if((s.m==='pre'||s.m==='fpre')&&remain<=5&&remain>0){
      const mark='warning:'+key+':'+remain+':'+n.toDateString();
      if(lastBeep!==mark){
        lastBeep=mark;
        beepWarning();
      }
    }

    // Warning 5 detik sebelum masuk mode sholat
    if(s.m==='iq'&&remain<=5&&remain>0){
      const mark='iqwarning:'+key+':'+remain+':'+n.toDateString();
      if(lastBeep!==mark){
        lastBeep=mark;
        beepWarning();
      }
    }

    // TOOOT saat masuk waktu sholat (pre -> iq)
    if(previousState.indexOf('pre:')===0&&s.m==='iq'){
      console.log('TRIGGER SHOLAT');
      beepSholat();
    }
  }

  // TOOOT saat masuk mode sholat (iq -> pr)
  if(previousState.indexOf('iq:')===0&&s.m==='pr'){
    console.log('TRIGGER MODE SHOLAT');
    beepSholat();
  }

  previousState=key;
}

function formatTanggalIndonesia(value){
  if(!value) return '-';
  const date = new Date(String(value).substring(0,10) + 'T00:00:00');
  if(isNaN(date.getTime())) return String(value);
  return date.toLocaleDateString('id-ID', {
    weekday:'long',
    day:'2-digit',
    month:'long',
    year:'numeric'
  });
}

function renderAgenda(list){

    if(!list || !list.length){
        return;
    }

    var el =
        document.getElementById(
            'agendaText'
        );

    if(!el){
        return;
    }

    var txt = '';

    list.forEach(function(item){

        var d = item.date || '';

        if(d){
            var p = d.split('-');

            if(p.length === 3){

                var bulan = [
                    'Jan','Feb','Mar','Apr',
                    'Mei','Jun','Jul','Agu',
                    'Sep','Okt','Nov','Des'
                ];

                d =
                    p[2] + '-' +
                    bulan[parseInt(p[1],10)-1] +
                    '-' + p[0];
            }
        }

        txt +=
            '<b>' + d + '</b><br>' +
            (item.notes || '-') +
            '<br><br>';
    });

    el.innerHTML = txt;

    //
    // reset animasi lama
    //
    el.classList.remove(
        'agenda-scroll-run'
    );

    el.style.animation = 'none';

    setTimeout(function(){

        var boxHeight =
            el.parentElement.clientHeight;

        var textHeight =
            el.scrollHeight;

        //
        // hanya scroll kalau teks
        // lebih tinggi dari kotak
        //
        if(textHeight > boxHeight){

            var chars =
                txt.replace(/<[^>]*>/g,'').length;

            //
            // semakin panjang teks
            // semakin lama durasinya
            //
            var duration =
                Math.max(
                    15,
                    Math.ceil(chars / 4)
                );

            el.style.animation =
                'agendaUp ' +
                duration +
                's linear infinite';

            el.classList.add(
                'agenda-scroll-run'
            );
        }

    },200);

}
